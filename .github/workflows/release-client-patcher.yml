name: Release client patcher
on:
  push:
    tags: ['client-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the release to
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package installer
        run: |
          set -euo pipefail
          cd installer
          zip -r ../NordicandiaClientPatcher.zip .
          cd ..
          sha256sum NordicandiaClientPatcher.zip > NordicandiaClientPatcher.zip.sha256
          cat NordicandiaClientPatcher.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" NordicandiaClientPatcher.zip NordicandiaClientPatcher.zip.sha256 --clobber \
            || gh release create "$TAG" NordicandiaClientPatcher.zip NordicandiaClientPatcher.zip.sha256 \
                 --title "Nordicandia client patcher $TAG" --generate-notes