worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events { worker_connections 1024; }

http {
    access_log logs/access.log;

    server {
        listen 127.0.0.1:8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     C:/Users/whxjt/nordicandia_re/server/certs/server-fullchain.pem;
        ssl_certificate_key C:/Users/whxjt/nordicandia_re/server/certs/server-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Standard TLS 1.3 suites; the earlier CCM-only value caused "no shared cipher".
        ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
        ssl_prefer_server_ciphers off;

        location / {
            grpc_pass grpc://127.0.0.1:50051;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }
    }
}
